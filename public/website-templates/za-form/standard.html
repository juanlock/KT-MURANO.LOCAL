<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>A clean, minimal and functional contact form</title>

    <link href="http://fonts.googleapis.com/css?family=Lato:300" rel="stylesheet" type="text/css">
    <style>
        body {
            font-family: Lato, sans-serif;
        }
        h1 {
            font-family: Lato, sans-serif;
            font-weight: 300;
            text-align: center;
        }
    </style>


    <!-- Vanilla's resources start here -->
    <link rel="stylesheet" href="css/vanilla-form.css">
    <script src="js/vanilla-form.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var myForm;
            myForm = new VanillaForm(document.querySelector("form.vanilla-form"));
        });
    </script>
    <!-- Vanilla's resources end here -->

</head>
<body>
<div class="content">
     <div class="form-container">
        <!--- Code Snippet - standard-form-markup --->
        <!-- Vanilla Form markup starts here -->
        <form action="standard-contact-form.php" method="post" class="vanilla-form" novalidate="novalidate">
            <!-- Left column -->
            <div class="column-50">
                <input type="text" name="name" placeholder="Your name" required="required">
                <input type="email" name="email" placeholder="Your e-mail" required="required">
            </div><!--
                Right column
            --><div class="column-50">
            <input type="tel" name="tel" placeholder="Phone">
            <label class="custom-select">
                <select name="pregunta1">
                    <option disabled selected>¿Cómo se enteró de nosotros?</option>
                    <option value="Buscando en internet"><option>Buscando en Internet</option>
                    <option value="Publicidad en Gogle"><option>Publicidad en Google</option>
                    <option value="Publicidad en Facebook"><option>Facebook</option>
                    <option value="Instagram"><option>Instagram</option>
                    <option value="Recomendación de un amigo"><option>Recomendación de un Amigo</option>
                    <option value="Otros"><option>Otros</option>
                </select><span><!-- fake select handler --></span>
            </label>
            </div>
            <label class="custom-select">
                <select name="pregunta2">
                    <option disabled selected>¿Qué buscas hacer?</option>
                    <option value="Servicio de Diseno y Publicidad"><option>Servicio de Diseño y Publicidad</option>
                    <option value="Desarrollo de Identidad Corporativa"><option>Desarrollo de Identidad Corporativa</option>
                    <option value="Produccion Fotografica"><option>Produccion Fotografica</option>
                </select><span><!-- fake select handler --></span>
            </label>
            <div class="column-100">
                <textarea name="message" placeholder="Escriba su mensaje aqui..."></textarea>
                <label>
                    <input type="checkbox" name="terms" value="true" required="required"><span><!-- fake checkbox --></span>
                    <span class="wrapped-label">I agree to the <a href="#">Terms & Conditions</a>.</span>
                </label>
            </div>
            <div class="column-100 center">
                <input type="submit" value="Enviar" data-error="Fix errors" data-processing="Sending..." data-success="Thank you!">
            </div>
            <footer class="notification-box"></footer>
        </form>
        <!-- Vanilla Form markup ends here -->
        <!--- /Code Snippet - standard-form-markup --->
    </div>
</div>
</body>
</html>
